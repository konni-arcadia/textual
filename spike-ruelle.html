<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spike — ruelle</title>
<style>
  html,body{margin:0;height:100%;background:#08070c;overflow:hidden;cursor:none;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---- a toucher ----
const BG="#08070c";
const FACADE=[150,138,116], STREET=[112,108,104], WARM=[255,200,130];
const RAMP=[' ','·',':','░','▒','▓'];
const ROWS=46, FONT="ui-monospace,'Consolas','Menlo',monospace";
// fenetres/lanternes : [profondeur k, mur, hauteur]
const lights=[[1,1,-0.30],[1,-1,-0.30],[2,1,-0.26],[2,-1,-0.26],[3,1,-0.22],[3,-1,-0.22],[4,1,-0.18],[4,-1,-0.18]];
// -------------------

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,DPR, drift=0, look=0, lookT=0, stars=[]; const keys={};
let last=performance.now(), t0=last;

function rgba(c,a){return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}
const sstep=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x);};
function init(){stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random()*0.5,tw:Math.random()*6.28,s:0.6+Math.random()});}
function fit(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=(now-t0)/1000;
  if(keys['arrowup']||keys['w'])drift+=dt*0.9; if(keys['arrowdown']||keys['s'])drift-=dt*0.9;
  if(keys['arrowleft']||keys['a'])lookT=Math.max(-1,lookT-dt*1.4);
  if(keys['arrowright']||keys['d'])lookT=Math.min(1,lookT+dt*1.4);
  if(!keys['arrowleft']&&!keys['a']&&!keys['arrowright']&&!keys['d'])lookT*=0.96;
  look+=(lookT-look)*0.1;

  const cx=W/2, vpX=cx+look*W*0.13, vpY=H*0.44, HW=W*0.62, HH=H*0.62;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);

  // CIEL : etoiles + lune (au-dessus des toits)
  ctx.globalCompositeOperation='lighter';
  const mx=W*0.2-look*30,my=H*0.16;
  let mg=ctx.createRadialGradient(mx,my,0,mx,my,60);
  mg.addColorStop(0,rgba([235,234,222],0.45));mg.addColorStop(0.25,rgba([235,234,222],0.18));mg.addColorStop(1,rgba([235,234,222],0));
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,60,0,Math.PI*2);ctx.fill();
  for(const s of stars){const X=s.x*W, Y=s.y*H; const ax=Math.abs((X-vpX)/HW),ay=Math.abs((Y-vpY)/HH);
    if(Y<vpY && ay>ax){ctx.fillStyle=rgba([235,234,222],(0.05+0.05*Math.sin(t*1.4+s.tw))); ctx.fillRect(X,Y,1.4,1.4);}}
  ctx.globalCompositeOperation='source-over';

  // brume froide au fond
  ctx.globalCompositeOperation='lighter';
  const fg=ctx.createRadialGradient(vpX,vpY,0,vpX,vpY,W*0.18);
  fg.addColorStop(0,rgba([60,70,95],0.18));fg.addColorStop(1,rgba([60,70,95],0));
  ctx.fillStyle=fg;ctx.beginPath();ctx.arc(vpX,vpY,W*0.18,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation='source-over';

  // FACADES + PAVES en fuite
  const fs=H/ROWS; ctx.font=`${fs}px ${FONT}`;
  const cw=ctx.measureText('▓').width||fs*0.6; const cols=Math.ceil(W/cw);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let r=0;r<ROWS;r++){const y=r*fs+fs/2, ayr=(y-vpY)/HH, ay=Math.abs(ayr);
    for(let c=0;c<cols;c++){const x=c*cw+cw/2, axr=(x-vpX)/HW, ax=Math.abs(axr);
      const m=Math.max(ax,ay); if(m<0.02)continue;
      const depth=Math.min(1,m), vertical=ax>=ay;
      if(!vertical && y<vpY) continue;            // ciel : on laisse respirer
      const ring=-Math.log(m)*2.6+drift, cf=ring-Math.floor(ring), seam=sstep(0.0,0.13,cf);
      let base, ink;
      if(vertical){ base=(0.30+0.5*depth)*(0.62+0.38*seam); ink=FACADE; }
      else { const cf2=(-Math.log(m)*4.0)%1; base=(0.24+0.55*depth)*(0.6+0.4*sstep(0.0,0.2,cf2<0?cf2+1:cf2)); ink=STREET; }
      const perp=vertical?(y-vpY)/HH:(x-vpX)/HW;
      const n=0.5+0.5*Math.sin(perp*30+ring*5)*Math.sin(ring*9+1.0);
      base*=0.82+0.18*n;
      const idx=Math.max(0,Math.min(RAMP.length-1,Math.round(base*(RAMP.length-1))));
      const ch=RAMP[idx]; if(ch===' ')continue;
      const alpha=Math.min(1,base)*depth*0.92; if(alpha<0.02)continue;
      ctx.fillStyle=rgba(ink,alpha); ctx.fillText(ch,x,y);
    }}

  // LUMIERES : fenetres + lanternes qui reculent, + porte au fond
  ctx.globalCompositeOperation='lighter';
  // porte eclairee au point de fuite
  const dpulse=0.7+0.3*Math.sin(t*1.5);
  let dg=ctx.createRadialGradient(vpX,vpY,0,vpX,vpY,46);
  dg.addColorStop(0,rgba([255,210,150],0.6*dpulse));dg.addColorStop(0.4,rgba([240,160,90],0.3*dpulse));dg.addColorStop(1,rgba([240,160,90],0));
  ctx.fillStyle=dg;ctx.beginPath();ctx.arc(vpX,vpY,46,0,Math.PI*2);ctx.fill();
  for(const[k,wall,hgt] of lights){
    const m=Math.pow(0.64,k);
    const lx=vpX+wall*m*HW*0.9, ly=vpY+hgt*m*HH;
    const fl=0.78+0.22*Math.sin(t*4+k*1.3+wall);
    const rad=Math.max(9,m*HW*0.4);
    const g=ctx.createRadialGradient(lx,ly,0,lx,ly,rad);
    g.addColorStop(0,rgba(WARM,0.5*fl*m));g.addColorStop(0.4,rgba([240,160,90],0.26*fl*m));g.addColorStop(1,rgba([240,160,90],0));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(lx,ly,rad,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=rgba([255,235,190],0.75*fl*Math.min(1,m*2)); // le carreau allume
    const wsz=Math.max(1.6,m*9); ctx.fillRect(lx-wsz/2,ly-wsz/2,wsz,wsz);
  }
  ctx.globalCompositeOperation='source-over';

  // la presence, a l'entree de la ruelle
  const pulse=0.5+0.5*Math.sin(t*2.0), px=cx+look*W*0.05, py=H*0.84;
  ctx.globalCompositeOperation='lighter';
  const gp=ctx.createRadialGradient(px,py,0,px,py,20+5*pulse);
  gp.addColorStop(0,rgba([248,237,212],0.8));gp.addColorStop(0.4,rgba(WARM,0.4));gp.addColorStop(1,rgba(WARM,0));
  ctx.fillStyle=gp;ctx.beginPath();ctx.arc(px,py,20+5*pulse,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation='source-over';

  ctx.font=`400 13px ${FONT}`;ctx.textAlign='center';ctx.fillStyle='rgba(150,138,116,0.32)';
  ctx.fillText('↑ / ↓ : descendre la ruelle   ·   ← / → : regarder (parallax)',W/2,H-26);
  requestAnimationFrame(frame);
}
addEventListener('resize',fit);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k.startsWith('arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
init();fit();requestAnimationFrame(frame);
</script>
</body>
</html>
