<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Romeo & Juliet — II.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const RAMP=[' ','·',':','░','▒','▓','█'], WARM=[255,200,130], MONO="ui-monospace,'Consolas',monospace";
const SERIF="'EB Garamond',Georgia,serif";
const WIN=[0.705,0.30], ROM=[0.34,0.74];   // fenetre de Juliette, position de Romeo
const beats=[
  {kind:'title', dur:4.4, title:'Roméo & Juliette', sub:'Acte II, scène 2 — le balcon'},
  {kind:'garden', dur:6.6, romeo:1, cap:['But soft! what light through yonder window breaks?','It is the east, and Juliet is the sun.']},
  {kind:'garden', dur:5.8, romeo:1, juliet:1, cap:['O Romeo, Romeo! wherefore art thou Romeo?']},
  {kind:'dialogue', dur:8.6, lines:[{n:'Juliet',t:'What’s in a name? That which we call a rose by any other name would smell as sweet.'},{n:'Romeo',t:'Call me but love, and I’ll be new baptized.'}]},
  {kind:'garden', dur:5.8, romeo:1, juliet:1, cap:['Good night, good night! Parting is such sweet sorrow.']},
  {kind:'constellation', dur:7.2, cap:['A pair of star-cross’d lovers.']},
  {kind:'title', dur:4.2, title:'— fin de la scène —', sub:''},
];

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,DPR, cacheGarden, stars=[];
let bi=0, lt=0, last=performance.now();

const rgba=(c,a)=>`rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
const mix=(a,b,k)=>a+(b-a)*k, mixc=(a,b,k)=>[mix(a[0],b[0],k),mix(a[1],b[1],k),mix(a[2],b[2],k)];
const sstep=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x);};
const hash=(x,y)=>{const v=Math.sin(x*127.1+y*311.7)*43758.5;return v-Math.floor(v);};
function fbm(x,y){let v=0,a=0.5,f=1;for(let o=0;o<4;o++){v+=a*Math.sin(x*f*0.9+o*1.7+1)*Math.cos(y*f*1.1-o*2.1);f*=2;a*=0.5;}return v*0.6;}
function newC(){const k=document.createElement('canvas');k.width=W*DPR;k.height=H*DPR;const g=k.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);return{k,g};}

function buildGarden(){const{k,g}=newC();const fs=Math.max(8,H/64);g.font=`${fs}px ${MONO}`;const cw=g.measureText('▓').width||fs*0.6;g.textAlign='center';g.textBaseline='middle';
  const hz=0.58, bushes=[{u:0.22,v:0.74,R:0.10},{u:0.46,v:0.80,R:0.09},{u:0.33,v:0.70,R:0.07}];
  for(let y=fs/2;y<H;y+=fs){const w=y/H;for(let x=cw/2;x<W;x+=cw){const u=x/W;
    let col=mixc([8,10,24],[24,22,46],sstep(0,hz,w)),V=0.08+0.05*w;
    if(w<hz-0.05&&hash(x,y)>0.985){V=0.5;col=[225,225,235];}                       // etoiles
    {const top=hz-0.04-0.04*(0.5+0.5*fbm(u*8,2));if(w>top&&u<0.62){const a=sstep(top,top+0.02,w)*0.8;V=V*(1-a)+0.34*a;col=mixc(col,[16,28,30],a);}}
    if(w>hz-0.02){const a=sstep(hz-0.02,hz+0.03,w);let tone=(0.34+0.24*(w-hz))*(0.85+0.15*(0.5+0.5*fbm(u*16,w*20)));V=V*(1-a)+Math.min(1,tone)*a;col=mixc(col,[18,26,22],a);}
    if(u>0.6){const wa=sstep(0.6,0.63,u);                                            // mur / tour
      let tone=(0.32+0.30*(1-w))*(0.72+0.28*(0.5+0.5*Math.sin(w*70)));
      const inWin=(u>0.655&&u<0.755&&w>0.20&&w<0.36);
      const arch=(u>0.655&&u<0.755&&w>0.16&&w<=0.20&&Math.abs(u-0.705)<0.05*sstep(0.16,0.20,w));
      if(inWin||arch){V=V*(1-wa)+0.85*wa;col=mixc(col,[255,212,150],wa*0.9);}
      else{V=V*(1-wa)+Math.min(1,tone)*wa;col=mixc(col,[60,56,62],wa);}}
    for(const b of bushes){const dx=(u-b.u)*W/H,dy=(w-b.v),dist=Math.hypot(dx,dy),edge=b.R*(0.8+0.2*fbm(u*14+b.u*9,w*14));
      if(dist<edge){const a=sstep(edge,edge*0.7,dist),leaf=0.5+0.5*fbm(u*30,w*30);V=V*(1-a)+Math.min(1,0.5*(0.6+0.6*leaf))*a;col=mixc(col,[18,34,24],a);
        if(hash(x*1.3,y*1.7)>0.93){col=mixc(col,[155,42,52],0.7);V=mix(V,0.7,0.5);}}}   // roses
    for(const f of [{u:0.06,v:0.9,R:0.34},{u:0.5,v:1.08,R:0.34}]){const dx=(u-f.u)*W/H,dy=(w-f.v),dist=Math.hypot(dx,dy),edge=f.R*(0.8+0.2*fbm(u*8,w*8));
      if(dist<edge){const a=sstep(edge,edge*0.6,dist)*0.96;V=V*(1-a)+0.85*a;col=mixc(col,[8,12,10],a);}}
    V*=0.9+0.1*(0.5+0.5*fbm(u*44,w*44));const ch=RAMP[Math.max(0,Math.min(6,Math.round(V*6)))];if(ch===' ')continue;
    g.fillStyle=rgba(col,Math.min(1,0.3+V*0.75));g.fillText(ch,x,y);}}
  return k;}

function figure(u,v){const cx=Math.abs(u-0.5),head=Math.exp(-(Math.pow((u-0.5)/0.058,2)+Math.pow((v-0.15)/0.072,2)));
  let body=0;if(v>=0.23){const tt=(v-0.23)/0.74,hw=0.05+tt*0.205;body=sstep(hw,hw*0.45,cx);}
  let d=Math.max(head,body);d*=1-sstep(0.86,1.02,v);d*=0.8+0.2*(0.5+0.5*Math.sin(u*26+v*38)*Math.sin(v*14+0.7));return Math.max(0,Math.min(1,d));}
function glow(x,y,r,c,a){ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,rgba(c,a));g.addColorStop(0.4,rgba([240,160,90],a*0.5));g.addColorStop(1,rgba([240,160,90],0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';}
function point(x,y,t){const p=0.5+0.5*Math.sin(t*2.2);glow(x,y,20+5*p,[248,237,212],0.8);
  ctx.fillStyle=rgba([255,247,224],0.95);ctx.beginPath();ctx.arc(x,y,2.4,0,Math.PI*2);ctx.fill();}

function sGarden(t,b){ctx.drawImage(cacheGarden,0,0,W,H);
  ctx.globalCompositeOperation='lighter';const mg=ctx.createRadialGradient(0.18*W,0.16*H,0,0.18*W,0.16*H,95);
  mg.addColorStop(0,rgba([205,214,238],0.4));mg.addColorStop(0.25,rgba([205,214,238],0.16));mg.addColorStop(1,rgba([205,214,238],0));
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(0.18*W,0.16*H,95,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';
  const fl=0.8+0.2*Math.sin(t*3+0.5);glow(WIN[0]*W,WIN[1]*H,62,WARM,0.5*fl);
  if(b&&b.juliet)point(WIN[0]*W,(WIN[1]+0.005)*H,t);
  if(b&&b.romeo)point(ROM[0]*W,ROM[1]*H,t);}
function sConstellation(t,dur){ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,W,H);const z=Math.min(1,t/dur),cxp=W/2,cyp=H/2;
  const figH=(H*0.7)*(1-sstep(0,0.55,z))+H*0.05*sstep(0,0.55,z),figA=1-sstep(0.5,0.62,z),heroA=sstep(0.5,0.64,z),starsA=sstep(0.6,0.95,z),thrA=sstep(0.78,1,z);
  if(thrA>0.01){ctx.globalCompositeOperation='lighter';for(let i=0;i<10;i++){const s=stars[i];ctx.strokeStyle=rgba([120,104,80],0.06*thrA);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cxp,cyp);ctx.lineTo(s.x*W,s.y*H);ctx.stroke();}ctx.globalCompositeOperation='source-over';}
  if(starsA>0.01){ctx.globalCompositeOperation='lighter';for(const s of stars){const tw=0.55+0.45*Math.sin(t*1.3+s.tw),a=starsA*tw*0.5,px=s.x*W,py=s.y*H,rr=s.s*2.2;const g=ctx.createRadialGradient(px,py,0,px,py,rr*4);g.addColorStop(0,rgba([248,237,212],a));g.addColorStop(1,rgba([240,184,120],0));ctx.fillStyle=g;ctx.fillRect(px-rr*4,py-rr*4,rr*8,rr*8);}ctx.globalCompositeOperation='source-over';}
  if(figA>0.01&&figH>22){const R=Math.max(10,Math.min(56,Math.round(figH/(H*0.7)*52))),fs=figH/R;ctx.font=`${fs}px ${MONO}`;const cw=ctx.measureText('▓').width||fs*0.6,cols=Math.max(1,Math.floor(figH*0.62/cw)),rx=cxp-cols*cw/2,ry=cyp-figH/2;ctx.textAlign='center';ctx.textBaseline='middle';
    for(let r=0;r<R;r++){const v=(r+0.5)/R,py=ry+r*fs+fs/2;for(let c=0;c<cols;c++){const u=(c+0.5)/cols,px=rx+c*cw+cw/2,d=figure(u,v);if(d<0.05)continue;const ch=RAMP[Math.max(0,Math.min(6,Math.round(d*0.62*6)))];if(ch===' ')continue;ctx.fillStyle=rgba([224,214,194],Math.min(1,d)*0.55*figA);ctx.fillText(ch,px,py);}}}
  if(heroA>0.01)point(cxp,cyp,t);}

function wrap(str,maxw,font){ctx.font=font;const words=str.split(' ');let lines=[],cur='';for(const w of words){const test=cur?cur+' '+w:w;if(ctx.measureText(test).width>maxw&&cur){lines.push(cur);cur=w;}else cur=test;}if(cur)lines.push(cur);return lines;}
function letterbox(){const bar=H*0.10;ctx.fillStyle='#000';ctx.fillRect(0,0,W,bar);ctx.fillRect(0,H-bar,W,bar);}

function drawText(b,t){const bar=H*0.10;
  if(b.kind==='title'){const a=sstep(0.3,1.4,t)*(1-sstep(b.dur-1.0,b.dur,t));ctx.textAlign='center';
    ctx.fillStyle=rgba([238,230,214],a);ctx.font=`500 ${Math.min(64,W*0.06)}px ${SERIF}`;ctx.fillText(b.title,W/2,H*0.46);
    if(b.sub){ctx.fillStyle=rgba([170,160,140],a*0.9);ctx.font=`italic 400 ${Math.min(24,W*0.02)}px ${SERIF}`;ctx.fillText(b.sub,W/2,H*0.46+Math.min(64,W*0.06)*0.8);}return;}
  if(b.kind==='dialogue'){const bw=Math.min(820,W*0.74),bx=(W-bw)/2;
    const li=t<4.0?0:1,line=b.lines[li],lt2=t<4.0?t:t-4.0,n=Math.floor((lt2-0.3)/0.042);
    const font=`400 ${Math.min(26,W*0.021)}px ${SERIF}`,vis='« '+line.t.slice(0,Math.max(0,n))+(n<line.t.length?'':' »');
    const lines=wrap(vis,bw-44,font),bh=Math.max(96,40+lines.length*32),by=H-bar-bh-26;
    ctx.fillStyle='rgba(12,12,18,0.82)';ctx.strokeStyle='rgba(200,184,150,0.4)';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,8);ctx.fill();ctx.stroke();
    ctx.textAlign='left';ctx.fillStyle=rgba(WARM,0.95);ctx.font=`500 ${Math.min(22,W*0.018)}px ${SERIF}`;ctx.fillText(line.n,bx+22,by+28);
    ctx.fillStyle='rgba(238,230,214,0.96)';ctx.font=font;lines.forEach((L,i)=>ctx.fillText(L,bx+22,by+60+i*32));return;}
  if(b.cap){const a=sstep(0.6,1.6,t)*(1-sstep(b.dur-1.0,b.dur,t));
    const font=`italic 400 ${Math.min(28,W*0.022)}px ${SERIF}`;ctx.font=font;ctx.textAlign='center';
    const joined=b.cap.join('  '),n=Math.floor((t-0.7)/0.04);let rem=n,shown=b.cap.map(L=>{const s=L.slice(0,Math.max(0,rem));rem-=L.length+2;return s;});
    const g=ctx.createLinearGradient(0,H-bar-130,0,H-bar);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.55)');ctx.fillStyle=g;ctx.fillRect(0,H-bar-130,W,130);
    ctx.fillStyle=rgba([238,230,214],a);shown.forEach((L,i)=>ctx.fillText(L,W/2,H-bar-26-(shown.length-1-i)*36));}
}

// ---- musique synthétisée (Web Audio) ----
let AC=null, master=null, fxIn=null, started=false, muted=false;
let chordIdx=0, step=0, nextChord=0, nextArp=0, nextMel=0;
const chords=[[110.00,164.81,261.63,329.63],[87.31,174.61,261.63,349.23],[130.81,196.00,261.63,392.00],[98.00,196.00,293.66,392.00]];
const penta=[440,523.25,587.33,659.25,783.99];
function note(freq,dur,vol,type,when){const t=when||AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=freq;o.connect(g);g.connect(fxIn);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.05);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t);o.stop(t+dur+0.05);}
function tick(){if(!AC)return;const t=AC.currentTime;
  const target=beats[bi].kind==='constellation'?0.30:(beats[bi].kind==='dialogue'?0.16:0.21);
  master.gain.linearRampToValueAtTime(muted?0:target,t+0.4);
  if(t>=nextChord){const ch=chords[chordIdx%chords.length];for(const f of ch)note(f,7.5,0.045,'sine',t);note(ch[0]/2,7.5,0.04,'triangle',t);chordIdx++;nextChord=t+6.0;}
  if(t>=nextArp){const ch=chords[(chordIdx-1+chords.length)%chords.length];note(ch[1+(step%3)]*2,1.8,0.045,'triangle',t);step++;nextArp=t+0.5;}
  if(t>=nextMel){if(Math.random()<0.6)note(penta[Math.floor(Math.random()*penta.length)],3.2,0.05,'sine',t);nextMel=t+2.2;}}
function startAudio(){if(started)return;started=true;
  AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);master.gain.linearRampToValueAtTime(0.21,AC.currentTime+3);
  const dl=AC.createDelay(1.0);dl.delayTime.value=0.34;const fb=AC.createGain();fb.gain.value=0.36;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;dl.connect(fb);fb.connect(lp);lp.connect(dl);
  const wet=AC.createGain();wet.gain.value=0.45;dl.connect(wet);wet.connect(master);
  fxIn=AC.createGain();fxIn.connect(master);fxIn.connect(dl);
  setInterval(tick,140);}

function fit(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
  stars=[];for(let i=0;i<90;i++){const ang=i*2.399963,rad=Math.sqrt(i/90);stars.push({x:0.5+Math.cos(ang)*rad*0.46*(0.7+Math.random()*0.5),y:0.5+Math.sin(ang)*rad*0.46*(0.7+Math.random()*0.5),tw:Math.random()*6.28,s:0.5+Math.random()*1.2});}
  cacheGarden=buildGarden();}

function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;lt+=dt;
  let b=beats[bi];if(lt>b.dur){bi=(bi+1)%beats.length;lt=0;b=beats[bi];}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(b.kind==='garden')sGarden(lt,b);
  else if(b.kind==='dialogue')sGarden(lt,{romeo:1,juliet:1});
  else if(b.kind==='constellation')sConstellation(lt,b.dur);
  drawText(b,lt);
  letterbox();
  const fade=Math.max(1-sstep(0,0.7,lt),sstep(b.dur-0.7,b.dur,lt));
  if(fade>0){ctx.fillStyle=rgba([0,0,0],fade);ctx.fillRect(0,0,W,H);}
  if(!started){ctx.textAlign='center';ctx.fillStyle=rgba([238,230,214],0.4+0.25*Math.sin(performance.now()/600));ctx.font=`italic 400 ${Math.min(20,W*0.016)}px ${SERIF}`;ctx.fillText('♪  cliquez pour la musique',W/2,H-H*0.10-14);}
  requestAnimationFrame(frame);}

addEventListener('resize',fit);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='m'){muted=!muted;return;}
  if(e.key===' '){if(!started){startAudio();e.preventDefault();return;}bi=(bi+1)%beats.length;lt=0;e.preventDefault();return;}
  if(k==='r'){bi=0;lt=0;}});
addEventListener('click',()=>{if(!started){startAudio();return;}bi=(bi+1)%beats.length;lt=0;});
fit();requestAnimationFrame(frame);
</script>
</body>
</html>
