<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spike — frémir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0d0c10;overflow:hidden;cursor:none;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---- à toucher ----
const PHRASE = "Il y avait une lumiere, et elle se souvenait de nous.";
const FONT   = "'EB Garamond', Georgia, serif";
const COL = {
  bg:   "#0d0c10",   // noir tiede
  ink:  "#efe6d6",   // ivoire chaud
  halo: "#f0b878",   // ambre
  mote: "#f5d9a8",   // poussiere de lumiere
};
const PUSH   = 16;    // amplitude du fremissement sous le curseur (px)
const RADIUS = 130;   // rayon d'influence du curseur (px)
const EASE   = 0.16;  // douceur du retour (0 = immobile, 1 = raide)
// -------------------

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR;
let letters = [];
let mouse = {x:-9999, y:-9999, has:false};
const t0 = performance.now();

function hexA(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function easeOut(x){ return 1 - Math.pow(1-x, 3); }

function fit(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}

function layout(){
  let size = Math.min(H*0.14, 64);
  ctx.font = `400 ${size}px ${FONT}`;
  let w = ctx.measureText(PHRASE).width;
  const maxW = W*0.82;
  if(w > maxW){ size *= maxW/w; ctx.font = `400 ${size}px ${FONT}`; w = ctx.measureText(PHRASE).width; }
  const startX = (W - w)/2;
  const baseY = H*0.5;
  letters = [];
  let x = startX;
  for(let i=0; i<PHRASE.length; i++){
    const ch = PHRASE[i];
    const cw = ctx.measureText(ch).width;
    letters.push({ ch, size, hx:x+cw/2, hy:baseY, cx:x+cw/2, cy:baseY, phase:i*0.5, appear:i*0.06 });
    x += cw;
  }
}

const motes = Array.from({length:18}, () => ({
  x: Math.random(), y: Math.random(),
  vy: 0.004 + Math.random()*0.006,
  sw: Math.random()*Math.PI*2,
  r:  0.6 + Math.random()*1.6,
  a:  0.05 + Math.random()*0.10,
}));

function frame(now){
  const t = (now - t0)/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);

  // fond + vignettage chaud
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0,0,W,H);
  const vg = ctx.createRadialGradient(W/2, H*0.5, 0, W/2, H*0.5, Math.max(W,H)*0.7);
  vg.addColorStop(0, 'rgba(60,44,30,0.18)');
  vg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  // poussieres de lumiere
  ctx.globalCompositeOperation = 'lighter';
  for(const m of motes){
    m.y -= m.vy*0.25; m.sw += 0.01;
    if(m.y < -0.05){ m.y = 1.05; m.x = Math.random(); }
    const px = (m.x + Math.sin(m.sw)*0.01)*W, py = m.y*H, rad = m.r*8;
    const g = ctx.createRadialGradient(px,py,0, px,py,rad);
    g.addColorStop(0, hexA(COL.mote, m.a));
    g.addColorStop(1, hexA(COL.mote, 0));
    ctx.fillStyle = g; ctx.fillRect(px-rad, py-rad, rad*2, rad*2);
  }

  // lettres
  for(const L of letters){
    const ap = easeOut(Math.max(0, Math.min(1, (t - L.appear)/0.9)));
    if(ap <= 0) continue;
    let infl = 0, ux = 0, uy = 0;
    if(mouse.has){
      const dx = L.hx-mouse.x, dy = L.hy-mouse.y, d = Math.hypot(dx,dy)||0.0001;
      if(d < RADIUS){ infl = 1 - d/RADIUS; infl *= infl; ux = dx/d; uy = dy/d; }
    }
    const bob = Math.sin(t*1.1 + L.phase)*1.6;
    const tx = L.hx + ux*PUSH*infl;
    const ty = L.hy + uy*PUSH*infl + bob + (1-ap)*18;
    L.cx += (tx - L.cx)*EASE;
    L.cy += (ty - L.cy)*EASE;

    const scale = (0.96 + 0.06*ap) * (1 + 0.16*infl);
    const alpha = ap*(0.72 + 0.28*infl);
    ctx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.translate(L.cx, L.cy);
    ctx.scale(scale, scale);
    ctx.font = `400 ${L.size}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = COL.halo;
    ctx.shadowBlur = 10 + 26*infl + 6*ap;
    ctx.fillStyle = hexA(COL.ink, alpha);
    ctx.fillText(L.ch, 0, 0);
    if(infl > 0){ ctx.shadowBlur = 4; ctx.fillStyle = hexA(COL.halo, 0.18*infl); ctx.fillText(L.ch, 0, 0); }
    ctx.restore();
  }

  // halo du curseur
  if(mouse.has){
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 70);
    g.addColorStop(0, hexA(COL.halo, 0.12));
    g.addColorStop(1, hexA(COL.halo, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 70, 0, Math.PI*2); ctx.fill();
  }

  requestAnimationFrame(frame);
}

addEventListener('resize', fit);
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.has = true; });
addEventListener('pointerleave', () => { mouse.has = false; });
fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
