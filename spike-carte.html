<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spike — carte</title>
<style>
  html,body{margin:0;height:100%;background:#0d0c10;overflow:hidden;cursor:none;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---- a toucher ----
const BG="#0d0c10", INK="#c9bba3", INK_WET="#f8edd4";
const RAMP=[' ','·','░','▒','▓'];
const RADIUS=150, ROWS=46;
const FONT="ui-monospace,'Consolas','Menlo',monospace";
const SEA=0.06;   // seuil mer / terre
const towns=[{x:0.62,y:0.44,r:0.085},{x:0.37,y:0.64,r:0.06}];
// -------------------

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,DPR,cw,fs,cols,rows,cells=[];
let charX=0,charY=0, mouse={x:-9999,y:-9999,has:false};
const keys={}; let last=performance.now(), t0=last;

function lerpC(a,b,k){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);
  const ar=(A>>16)&255,ag=(A>>8)&255,ab=A&255,br=(B>>16)&255,bg=(B>>8)&255,bb=B&255;
  return[Math.round(ar+(br-ar)*k),Math.round(ag+(bg-ag)*k),Math.round(ab+(bb-ab)*k)];}
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function land(u,w){
  let v=Math.sin(u*3.1+1.0)*Math.cos(w*2.7-0.5);
  v+=0.5*Math.sin(u*6.3-2.0)*Math.cos(w*5.1+1.7);
  v+=0.25*Math.sin(u*12.0+0.3)*Math.cos(w*9.0-1.1);
  return v*0.5;
}
function townD(u,w){
  let d=0;
  for(const t of towns){const dist=Math.hypot(u-t.x,w-t.y); if(dist<t.r) d=Math.max(d,1-dist/t.r);}
  return d;
}

function fit(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(charX===0){charX=towns[0].x*W;charY=towns[0].y*H;}
  layout();
}
function layout(){
  fs=H/ROWS; ctx.font=`${fs}px ${FONT}`;
  cw=ctx.measureText('▓').width||fs*0.6;
  cols=Math.ceil(W/cw); rows=ROWS; cells=[];
  for(let r=0;r<rows;r++){const w=(r+0.5)/rows, py=r*fs+fs/2;
    for(let c=0;c<cols;c++){const u=(c+0.5)/cols, px=c*cw+cw/2;
      const v=land(u,w), tw=townD(u,w);
      const sea=v<SEA && tw<0.15;
      const coast=Math.abs(v-SEA)<0.05 && tw<0.15;
      let base = sea ? 0.18 : 0.45+Math.min(0.5,(v-SEA)*1.1);
      base=Math.max(base, tw*1.1);
      cells.push({px,py,sea,coast,base,town:tw,ph:c*0.7+r*1.3});
    }}
}

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=(now-t0)/1000;
  let mx=0,my=0;
  if(keys['arrowleft']||keys['a'])mx-=1; if(keys['arrowright']||keys['d'])mx+=1;
  if(keys['arrowup']||keys['w'])my-=1;   if(keys['arrowdown']||keys['s'])my+=1;
  const sp=W*0.14*dt;
  charX=Math.max(0,Math.min(W,charX+mx*sp)); charY=Math.max(0,Math.min(H,charY+my*sp));

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  const fade=Math.min(1,t/1.4);
  ctx.font=`${fs}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const cell of cells){
    let d=cell.base;
    if(cell.sea) d+=0.05+0.05*Math.sin(t*0.8+cell.ph);   // clapot
    if(cell.coast) d+=0.12;
    let prox=0;
    if(mouse.has){const dx=cell.px-mouse.x,dy=cell.py-mouse.y,dd=Math.hypot(dx,dy);
      if(dd<RADIUS){prox=1-dd/RADIUS;prox*=prox;}}
    d*=0.78+prox*0.5; const w=prox;
    const idx=Math.max(0,Math.min(RAMP.length-1,Math.round(d*(RAMP.length-1))));
    const ch=RAMP[idx]; if(ch===' ')continue;
    const ink=lerpC(INK,INK_WET,(cell.town>0?0.3:0.05)+0.7*w);
    const alpha=Math.min(1,d)*(cell.sea?0.5:0.72)*(0.7+0.4*w)*fade;
    if(alpha<0.02)continue;
    ctx.fillStyle=rgba(ink,alpha); ctx.fillText(ch,cell.px,cell.py);
  }
  // le perso = un point de lumiere sur la carte
  const pulse=0.5+0.5*Math.sin(t*2.2);
  ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(charX,charY,0,charX,charY,26+6*pulse);
  g.addColorStop(0,rgba([248,237,212],0.9));g.addColorStop(0.3,rgba([240,184,120],0.5));g.addColorStop(1,rgba([240,184,120],0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(charX,charY,26+6*pulse,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=rgba([255,247,224],0.95);ctx.beginPath();ctx.arc(charX,charY,2.4,0,Math.PI*2);ctx.fill();

  ctx.font=`400 13px ${FONT}`;ctx.textAlign='center';ctx.fillStyle='rgba(201,187,163,0.28)';
  ctx.fillText('flèches / WASD : déplacer le point  ·  la souris avive l’encre',W/2,H-26);
  requestAnimationFrame(frame);
}
addEventListener('resize',fit);
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.has=true;});
addEventListener('pointerleave',()=>{mouse.has=false;});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k.startsWith('arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
fit();requestAnimationFrame(frame);
</script>
</body>
</html>
