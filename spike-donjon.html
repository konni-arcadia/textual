<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spike — donjon</title>
<style>
  html,body{margin:0;height:100%;background:#070608;overflow:hidden;cursor:none;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---- a toucher ----
const BG="#070608", STONE="#b9ad97";
const RAMP=[' ','·',':','░','▒','▓'];
const ROWS=46, FONT="ui-monospace,'Consolas','Menlo',monospace";
const torches=[[1,1],[2,-1],[3,1],[4,-1],[5,1]];  // [profondeur, mur]
// -------------------

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,DPR, drift=0, look=0, lookT=0; const keys={};
let last=performance.now(), t0=last;

function lerpC(a,b,k){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);
  const ar=(A>>16)&255,ag=(A>>8)&255,ab=A&255,br=(B>>16)&255,bg=(B>>8)&255,bb=B&255;
  return[Math.round(ar+(br-ar)*k),Math.round(ag+(bg-ag)*k),Math.round(ab+(bb-ab)*k)];}
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const sstep=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x);};
function fit(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=(now-t0)/1000;
  if(keys['arrowup']||keys['w']) drift+=dt*0.9;
  if(keys['arrowdown']||keys['s']) drift-=dt*0.9;
  if(keys['arrowleft']||keys['a']) lookT=Math.max(-1,lookT-dt*1.4);
  if(keys['arrowright']||keys['d']) lookT=Math.min(1,lookT+dt*1.4);
  if(!keys['arrowleft']&&!keys['a']&&!keys['arrowright']&&!keys['d']) lookT*=0.96;
  look+=(lookT-look)*0.1;

  const cx=W/2, vpX=cx+look*W*0.13, vpY=H*0.46, HW=W*0.62, HH=H*0.62;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);

  // PIERRE en fausse perspective (couloir qui s'enfonce)
  const fs=H/ROWS; ctx.font=`${fs}px ${FONT}`;
  const cw=ctx.measureText('▓').width||fs*0.6; const cols=Math.ceil(W/cw);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let r=0;r<ROWS;r++){const y=r*fs+fs/2, ayr=(y-vpY)/HH, ay=Math.abs(ayr);
    for(let c=0;c<cols;c++){const x=c*cw+cw/2, axr=(x-vpX)/HW, ax=Math.abs(axr);
      const m=Math.max(ax,ay); if(m<0.02)continue;
      const depth=Math.min(1,m);
      const ring=-Math.log(m)*2.6+drift, cf=ring-Math.floor(ring);
      const seam=sstep(0.0,0.13,cf);                 // joint sombre par assise
      const vertical=ax>=ay;
      let base=0.22+0.62*depth;
      base*=0.55+0.45*seam;
      if(!vertical) base*=(y>vpY?1.05:0.78);          // sol clair / plafond sombre
      const perp=vertical?(y-vpY)/HH:(x-vpX)/HW;
      const n=0.5+0.5*Math.sin(perp*30+ring*5)*Math.sin(ring*9+1.0);
      base*=0.82+0.18*n;
      const idx=Math.max(0,Math.min(RAMP.length-1,Math.round(base*(RAMP.length-1))));
      const ch=RAMP[idx]; if(ch===' ')continue;
      const alpha=Math.min(1,base)*depth*0.92;
      if(alpha<0.02)continue;
      ctx.fillStyle=rgba(STONE.startsWith('#')?lerpC(STONE,STONE,0):[185,173,151],alpha);
      ctx.fillText(ch,x,y);
    }}

  // TORCHES (la lumiere chaude qui s'enfonce, vacillante)
  ctx.globalCompositeOperation='lighter';
  for(const[k,wall] of torches){
    const m=Math.pow(0.62,k);
    const tx=vpX+wall*m*HW*0.92, ty=vpY-m*HH*0.16;
    const fl=0.65+0.35*Math.sin(t*7+k)*Math.sin(t*3.3+k*1.7+0.5);
    const rad=Math.max(10,m*HW*0.55);
    const g=ctx.createRadialGradient(tx,ty,0,tx,ty,rad);
    g.addColorStop(0,rgba([255,205,135],0.55*fl*m));
    g.addColorStop(0.35,rgba([240,150,80],0.30*fl*m));
    g.addColorStop(1,rgba([240,150,80],0));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(tx,ty,rad,0,Math.PI*2);ctx.fill();
    // la flamme
    ctx.fillStyle=rgba([255,235,190],0.8*fl*Math.min(1,m*2));
    ctx.beginPath();ctx.arc(tx,ty,Math.max(1.4,m*8),0,Math.PI*2);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';

  // la presence, a l'entree du couloir
  const pulse=0.5+0.5*Math.sin(t*2.0), px=cx+look*W*0.05, py=H*0.86;
  ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(px,py,0,px,py,22+5*pulse);
  g.addColorStop(0,rgba([248,237,212],0.8));g.addColorStop(0.4,rgba([240,184,120],0.4));g.addColorStop(1,rgba([240,184,120],0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,22+5*pulse,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation='source-over';

  ctx.font=`400 13px ${FONT}`;ctx.textAlign='center';ctx.fillStyle='rgba(185,173,151,0.30)';
  ctx.fillText('↑ / ↓ : s’enfoncer   ·   ← / → : regarder (parallax)',W/2,H-26);
  requestAnimationFrame(frame);
}
addEventListener('resize',fit);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k.startsWith('arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
fit();requestAnimationFrame(frame);
</script>
</body>
</html>
