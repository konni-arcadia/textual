<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spike — clairière</title>
<style>
  html,body{margin:0;height:100%;background:#0a0b12;overflow:hidden;cursor:none;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---- a toucher ----
const RAMP=[' ','·',':','░','▒','▓','█'];
const WARM=[255,200,130];
const horizon=0.50;
const trees=[
  {u:0.22,v:0.42,R:0.17,col:[24,38,32],tone:0.58,seed:3.0},
  {u:0.80,v:0.37,R:0.21,col:[18,32,28],tone:0.62,seed:9.0},
  {u:0.45,v:0.31,R:0.12,col:[40,54,50],tone:0.42,seed:5.0},   // lointain, plus pale
];
const fg=[ {u:0.07,v:0.86,R:0.36}, {u:0.95,v:0.18,R:0.30}, {u:0.5,v:1.05,R:0.32} ];
const shrine={u:0.62,w:horizon+0.015,hw:0.045,hh:0.11};
// -------------------

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,DPR, scene, glows=[], motes=[];
let cu=0.5, cw_=0.80; const keys={};
let last=performance.now(), t0=last;

const rgba=(c,a)=>`rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
const mix=(a,b,k)=>a+(b-a)*k;
const mixc=(a,b,k)=>[mix(a[0],b[0],k),mix(a[1],b[1],k),mix(a[2],b[2],k)];
const sstep=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x);};
const hash=(x,y)=>{const v=Math.sin(x*127.1+y*311.7)*43758.5;return v-Math.floor(v);};
function fbm(x,y){let v=0,a=0.5,f=1.0;for(let o=0;o<4;o++){v+=a*Math.sin(x*f*0.9+o*1.7+1.0)*Math.cos(y*f*1.1-o*2.1);f*=2;a*=0.5;}return v*0.6;}

function skyCol(w){return mixc([26,26,46],[92,64,64],sstep(0.0,horizon,w));}

function buildScene(){
  scene=document.createElement('canvas');scene.width=W*DPR;scene.height=H*DPR;
  const g=scene.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  const fs=Math.max(8,H/64);g.font=`${fs}px ui-monospace,'Consolas',monospace`;
  const cw=g.measureText('▓').width||fs*0.6; g.textAlign='center';g.textBaseline='middle';
  glows=[];
  for(let y=fs/2;y<H;y+=fs){const w=y/H;
    for(let x=cw/2;x<W;x+=cw){const u=x/W;
      let col=skyCol(w), V=0.10+0.05*w;
      // etoiles
      if(w<horizon-0.06 && hash(x,y)>0.986){V=0.5;col=[230,228,220];}
      // ligne d'arbres lointaine
      {const top=horizon-0.05-0.05*(0.5+0.5*fbm(u*7,2.0));
       if(w>top){const a=sstep(top,top+0.02,w)*0.9;V=V*(1-a)+0.40*a;col=mixc(col,[30,46,50],a*0.9);}}
      // brume
      {const a=Math.exp(-Math.pow((w-(horizon-0.01))/0.045,2))*0.55;
       col=mixc(col,[122,130,142],a*0.6);V=mix(V,0.30,a*0.4);}
      // sol + sentier
      if(w>horizon-0.02){const a=sstep(horizon-0.02,horizon+0.03,w);
        let tone=(0.40+0.30*(w-horizon))*(0.85+0.15*(0.5+0.5*fbm(u*16,w*20)));
        let gcol=[34,42,36];
        const pc=0.5+0.16*Math.sin(w*7+1.0)+0.05*fbm(w*10,3.0), pw=0.045+0.06*(w-horizon);
        if(Math.abs(u-pc)<pw){const pa=sstep(pw,pw*0.5,Math.abs(u-pc));gcol=mixc(gcol,[98,88,70],pa);tone=mix(tone,tone*1.35,pa);}
        V=V*(1-a)+Math.min(1,tone)*a;col=mixc(col,gcol,a);}
      // cabane + lucarne
      {const s=shrine; if(u>s.u-s.hw&&u<s.u+s.hw&&w>s.w-s.hh&&w<s.w){V=mix(V,0.82,0.9);col=mixc(col,[24,22,26],0.85);}
       if(w<s.w-s.hh+0.01){const rt=sstep(s.u-s.hw-0.02,s.u,u)*sstep(s.u+s.hw+0.02,s.u,u);}}
      // arbres (masses de feuillage irregulieres)
      for(const tr of trees){const dx=(u-tr.u)*W/H, dy=(w-tr.v), dist=Math.hypot(dx,dy);
        const edge=tr.R*(0.78+0.24*fbm(u*12+tr.seed*10,w*12+tr.seed));
        if(dist<edge){const a=sstep(edge,edge*0.82,dist);
          const leaf=0.5+0.5*fbm(u*30+tr.seed,w*34);
          V=V*(1-a)+Math.min(1,tr.tone*(0.6+0.6*leaf))*a;col=mixc(col,tr.col,a);}
        if(Math.abs(u-tr.u)<0.007&&w>tr.v&&w<tr.v+tr.R*1.15){V=mix(V,0.8,0.7);col=mixc(col,[26,20,16],0.8);}}
      // premier plan sombre (cadre / bokeh)
      for(const f of fg){const dx=(u-f.u)*W/H, dy=(w-f.v), dist=Math.hypot(dx,dy);
        const edge=f.R*(0.8+0.2*fbm(u*8+f.u*20,w*8));
        if(dist<edge){const a=sstep(edge,edge*0.6,dist)*0.96;const leaf=0.5+0.5*fbm(u*22,w*24);
          V=V*(1-a)+(0.85+0.15*leaf)*a;col=mixc(col,[12,15,13],a);}}
      // grain
      V*=0.9+0.1*(0.5+0.5*fbm(u*44,w*44));
      const ch=RAMP[Math.max(0,Math.min(RAMP.length-1,Math.round(V*(RAMP.length-1))))];
      if(ch===' ')continue;
      g.fillStyle=rgba(col,Math.min(1,0.30+V*0.75));g.fillText(ch,x,y);
    }}
  glows.push({x:shrine.u*W,y:(shrine.w-0.05)*H,r:42,base:0.6});   // lucarne
  glows.push({x:0.30*W,y:(horizon+0.10)*H,r:26,base:0.4});        // lanterne sentier
}

function fit(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
  motes=[];for(let i=0;i<22;i++)motes.push({u:Math.random(),w:horizon+Math.random()*0.45,ph:Math.random()*6.28,sp:0.2+Math.random()*0.5});
  buildScene();}

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=(now-t0)/1000;
  let mx=0,my=0;
  if(keys['arrowleft']||keys['a'])mx-=1;if(keys['arrowright']||keys['d'])mx+=1;
  if(keys['arrowup']||keys['w'])my-=1;if(keys['arrowdown']||keys['s'])my+=1;
  cu=Math.max(0.1,Math.min(0.9,cu+mx*0.18*dt));
  cw_=Math.max(horizon+0.04,Math.min(0.94,cw_+my*0.14*dt));

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);ctx.drawImage(scene,0,0,W,H);

  // lueurs chaudes vacillantes
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<glows.length;i++){const gl=glows[i],fl=0.75+0.25*Math.sin(t*3.5+i*1.4);
    const g=ctx.createRadialGradient(gl.x,gl.y,0,gl.x,gl.y,gl.r);
    g.addColorStop(0,rgba(WARM,gl.base*fl));g.addColorStop(0.4,rgba([240,160,90],gl.base*0.5*fl));g.addColorStop(1,rgba([240,160,90],0));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(gl.x,gl.y,gl.r,0,Math.PI*2);ctx.fill();}
  // lucioles
  for(const m of motes){m.w-=m.sp*0.0006; if(m.w<horizon)m.w=0.95;
    const x=(m.u+0.01*Math.sin(t*0.6+m.ph))*W, y=m.w*H, a=0.25+0.25*Math.sin(t*2+m.ph);
    const g=ctx.createRadialGradient(x,y,0,x,y,7);g.addColorStop(0,rgba([255,225,150],a));g.addColorStop(1,rgba([255,225,150],0));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();}
  ctx.globalCompositeOperation='source-over';

  // la presence
  const px=cu*W, py=cw_*H, pulse=0.5+0.5*Math.sin(t*2.2);
  ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(px,py,0,px,py,20+5*pulse);
  g.addColorStop(0,rgba([248,237,212],0.8));g.addColorStop(0.4,rgba(WARM,0.4));g.addColorStop(1,rgba(WARM,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,20+5*pulse,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=rgba([255,247,224],0.95);ctx.beginPath();ctx.arc(px,py,2.4,0,Math.PI*2);ctx.fill();

  ctx.font=`400 13px ui-monospace,monospace`;ctx.textAlign='center';ctx.fillStyle='rgba(150,150,130,0.32)';
  ctx.fillText('flèches / WASD : marcher dans la clairière  ·  fond peint, caméra fixe',W/2,H-26);
  requestAnimationFrame(frame);
}
addEventListener('resize',fit);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k.startsWith('arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
fit();requestAnimationFrame(frame);
</script>
</body>
</html>
